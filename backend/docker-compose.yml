services:
  postgres:
    image: postgres:16-alpine
    container_name: kiddo-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: kiddo_user
      POSTGRES_PASSWORD: kiddo_password
      POSTGRES_DB: kiddodb
    ports:
      - '5432:5432'
    volumes:
      - kiddo_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U kiddo_user -d kiddodb']
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s

volumes:
  kiddo_pgdata:
